<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Lega Fantacalcio Barriera dell'M - Portale ufficiale della Lega dal 1995.">
<title>Lega Fantacalcio Barriera dell'M</title>

<style>
    :root {
        --blue-dark: #061f3d;
        --blue: #0b4f8a;
        --blue-light: #1677bd;
        --blue-soft: #eaf5ff;
        --gold: #d6a928;
        --white: #ffffff;
        --text: #10233d;
    }

    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
        background:
            radial-gradient(circle at 50% 45%, rgba(255,255,255,.98) 0%, rgba(239,248,255,.96) 38%, rgba(209,232,248,.96) 100%);
        overflow-x: hidden;
    }

    /* =====================================================
       MENU PRINCIPALE
    ===================================================== */

    .topbar {
        position: sticky;
        top: 0;
        z-index: 1000;
        width: 100%;
        background: linear-gradient(180deg, #062a50 0%, #073b68 100%);
        border-bottom: 3px solid rgba(214,169,40,.85);
        box-shadow: 0 8px 25px rgba(4,32,59,.22);
    }

    .nav-wrap {
        width: min(1500px, 100%);
        margin: 0 auto;
        padding: 0 18px;
    }

    .main-nav {
        display: flex;
        align-items: stretch;
        justify-content: center;
        min-height: 68px;
        overflow-x: auto;
        scrollbar-width: thin;
        scrollbar-color: rgba(255,255,255,.35) transparent;
    }

    .main-nav::-webkit-scrollbar {
        height: 5px;
    }

    .main-nav::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,.35);
        border-radius: 10px;
    }

    .main-nav a {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 68px;
        padding: 0 17px;
        color: rgba(255,255,255,.92);
        text-decoration: none;
        text-transform: uppercase;
        font-size: .78rem;
        font-weight: 700;
        letter-spacing: .035em;
        white-space: nowrap;
        transition: background .2s ease, color .2s ease, transform .2s ease;
    }

    .main-nav a::after {
        content: "";
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: 0;
        height: 3px;
        background: var(--gold);
        transform: scaleX(0);
        transition: transform .2s ease;
    }

    .main-nav a:hover {
        color: #fff;
        background: rgba(255,255,255,.08);
    }

    .main-nav a:hover::after {
        transform: scaleX(1);
    }

    /* =====================================================
       HOME
    ===================================================== */

    .home {
        position: relative;
        min-height: calc(100vh - 68px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 42px 20px 55px;
        overflow: hidden;
    }

    .home::before,
    .home::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
        filter: blur(2px);
    }

    .home::before {
        width: 520px;
        height: 520px;
        top: -210px;
        left: -180px;
        background: radial-gradient(circle, rgba(22,119,189,.15), transparent 68%);
    }

    .home::after {
        width: 600px;
        height: 600px;
        right: -260px;
        bottom: -280px;
        background: radial-gradient(circle, rgba(11,79,138,.13), transparent 68%);
    }

    .home-content {
        position: relative;
        z-index: 2;
        width: min(920px, 100%);
        text-align: center;
    }

    .league-title {
        margin: 0;
        color: var(--blue-dark);
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2rem, 4.2vw, 4rem);
        font-weight: 700;
        line-height: 1.05;
        letter-spacing: -.025em;
        text-shadow: 0 2px 0 rgba(255,255,255,.75);
    }

    .league-subtitle {
        margin: 14px 0 0;
        color: var(--blue);
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1rem, 2vw, 1.45rem);
        font-weight: 700;
        letter-spacing: .08em;
        text-transform: uppercase;
    }

    .title-line {
        width: min(620px, 80%);
        height: 1px;
        margin: 25px auto 25px;
        background: linear-gradient(90deg, transparent, rgba(11,79,138,.65), transparent);
    }

    .founded {
        margin: 0;
        color: #28486a;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: .05em;
    }

    .founded strong {
        display: block;
        margin-top: 4px;
        color: var(--blue);
        font-size: 1.45rem;
    }

    .logo-frame {
        width: min(500px, 78vw);
        min-height: 300px;
        margin: 30px auto 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        border: 1px solid rgba(11,79,138,.14);
        border-radius: 32px;
        background: rgba(255,255,255,.64);
        box-shadow:
            0 24px 65px rgba(6,31,61,.13),
            inset 0 1px 0 rgba(255,255,255,.95);
        backdrop-filter: blur(8px);
    }

    .logo-frame img {
        display: block;
        width: auto;
        max-width: 100%;
        max-height: 310px;
        object-fit: contain;
    }

    .home-note {
        margin: 24px 0 0;
        color: #52708e;
        font-family: Georgia, "Times New Roman", serif;
        font-size: .95rem;
        font-style: italic;
    }

    /* =====================================================
       RESPONSIVE
    ===================================================== */

    @media (max-width: 1050px) {
        .main-nav {
            justify-content: flex-start;
        }

        .main-nav a {
            padding: 0 14px;
            font-size: .74rem;
        }
    }

    @media (max-width: 600px) {
        .topbar {
            border-bottom-width: 2px;
        }

        .nav-wrap {
            padding: 0 8px;
        }

        .main-nav {
            min-height: 58px;
        }

        .main-nav a {
            min-height: 58px;
            padding: 0 12px;
            font-size: .68rem;
        }

        .main-nav a::after {
            left: 11px;
            right: 11px;
        }

        .home {
            min-height: calc(100vh - 58px);
            padding: 35px 16px 45px;
        }

        .league-title {
            font-size: clamp(1.75rem, 8vw, 2.5rem);
        }

        .league-subtitle {
            font-size: .88rem;
        }

        .title-line {
            margin: 19px auto;
        }

        .founded {
            font-size: .88rem;
        }

        .founded strong {
            font-size: 1.2rem;
        }

        .logo-frame {
            width: min(430px, 94vw);
            min-height: 255px;
            margin-top: 24px;
            padding: 18px;
            border-radius: 24px;
        }

        .logo-frame img {
            max-height: 260px;
        }

        .home-note {
            font-size: .82rem;
        }
    }
</style>
</head>

<body>

     FASCIA DI NAVIGAZIONE

        </nav>
    </div>
</header>

<!-- =====================================================
     PAGINA INIZIALE
===================================================== -->
<main class="home">
    <div class="home-content">

        <h1 class="league-title">Lega Fantacalcio Barriera dell'M</h1>
        <p class="league-subtitle">Portale ufficiale della Lega</p>

        <div class="title-line"></div>

        <p class="founded">
            Anno di fondazione
            <strong>1995</strong>
        </p>

        <div class="logo-frame">
            <img src="leganet.gif" alt="Logo della Lega Fantacalcio Barriera dell'M">
        </div>

        <p class="home-note">Una storia di fantacalcio, rivalità e amicizia dal 1995.</p>

    </div>
</main>

</body>
</html>
