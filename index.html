<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lefabam - Home Portale</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --accent: #f59e0b;
            --dark: #0f172a;
            --light: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
    background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    color: white;
    overflow-x: hidden;
    scroll-behavior: smooth; /* Aggiungi questa riga */
}

        header {
            text-align: center;
            padding: 20px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        header h1 {
            font-size: 2rem;
            letter-spacing: 2px;
            color: var(--light);
        }

        header span {
            color: var(--accent);
            font-weight: bold;
        }

        /* Schermata Principale */
        .main-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
        }

        /* Hub Centrale Radiale */
        .radial-hub {
            position: relative;
            width: 600px;
            height: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Logo al Centro Extra Large */
        .center-logo {
            width: 320px;
            height: 320px;
            background: linear-gradient(135deg, var(--primary), #3b82f6);
            border: 5px solid var(--accent);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 40px rgba(59, 130, 246, 0.6);
            z-index: 10;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            overflow: hidden;
        }

        .center-logo:hover {
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(245, 158, 11, 0.6);
        }

        /* Bottoni delle Sezioni Intorno */
        .section-node {
            position: absolute;
            width: 130px;
            height: 130px;
            background: rgba(30, 41, 59, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: white;
            font-weight: 600;
            font-size: 0.95rem;
            text-align: center;
            padding: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            backdrop-filter: blur(5px);
        }

        .section-node:hover {
            border-color: var(--accent);
            background: var(--primary);
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(30, 58, 138, 0.5);
        }

        .section-node .icon {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        /* Posizionamento geometrico a raggiera */
        .node-classifiche { top: -20px; left: calc(50% - 65px); }
        .node-statistiche { top: 90px; right: -10px; }
        .node-societa { bottom: 90px; right: -10px; }
        .node-albo { bottom: -20px; left: calc(50% - 65px); }
        .node-regolamento { bottom: 90px; left: -10px; }
        .node-contatti { top: 90px; left: -10px; }

        /* Contenitore per le sezioni interne posizionato SOTTO la raggiera */
        .content-container {
            max-width: 900px;
            margin: 0 auto 60px auto;
            padding: 0 20px;
            width: 100%;
        }

        /* Stile Sezione Storia & Timeline */
        .card-storia {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            scroll-margin-top: 40px; /* Aiuta lo scorrimento automatico */
        }

        .card-storia h2 {
            color: var(--accent);
            font-size: 2rem;
            margin-bottom: 15px;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .intro-storia {
            color: #94a3b8;
            margin-bottom: 40px;
            font-size: 1.1rem;
        }

        .timeline {
            position: relative;
            max-width: 800px;
            margin: 0 auto;
            padding-left: 50px;
        }

        .timeline::after {
            content: '';
            position: absolute;
            width: 4px;
            background-color: var(--primary);
            top: 10px;
            bottom: 10px;
            left: 15px;
            margin-left: -2px;
            border-radius: 2px;
        }

        .timeline-item {
            padding: 10px 0 40px 0;
            position: relative;
        }

        .timeline-badge {
            position: absolute;
            width: 70px;
            height: 35px;
            left: -75px;
            top: 12px;
            background: var(--accent);
            color: var(--dark);
            font-weight: bold;
            text-align: center;
            line-height: 35px;
            border-radius: 6px;
            font-size: 0.95rem;
            box-shadow: 0 4px 10px rgba(245, 158, 11, 0.3);
            z-index: 1;
        }

        .timeline-content {
            padding: 25px;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            border-left: 5px solid var(--accent);
        }

        .timeline-content h3 {
            color: var(--light);
            margin-bottom: 10px;
            font-size: 1.4rem;
        }

        .timeline-content p {
            color: #cbd5e1;
            font-size: 1rem;
            line-height: 1.7;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: rgba(15, 23, 42, 0.8);
            font-size: 0.85rem;
            color: #64748b;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            width: 100%;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            body { overflow-y: auto; }
            .main-container { padding: 30px 20px; }
            .radial-hub {
                width: 100%;
                height: auto;
                display: flex;
                flex-direction: column;
                gap: 20px;
            }
            .center-logo {
                position: relative;
                order: -1;
                margin-bottom: 20px;
                width: 260px;
                height: 260px;
            }
            .section-node {
                position: relative;
                width: 100%;
                max-width: 280px;
                height: 70px;
                flex-direction: row;
                justify-content: flex-start;
                gap: 20px;
                padding-left: 25px;
                border-radius: 12px;
                top: auto !important;
                bottom: auto !important;
                left: auto !important;
                right: auto !important;
            }
            .section-node .icon { margin-bottom: 0; }
            .timeline { padding-left: 0; }
            .timeline::after { display: none; }
            .timeline-badge {
                position: relative;
                left: 0;
                top: 0;
                margin-bottom: 15px;
                display: inline-block;
            }
        }
    </style>
</head>
<!-- SCRIPT PER LO SCORRIMENTO FLUIDO -->
    <script>
        document.querySelector('.node-albo').addEventListener('click', function(e) {
            e.preventDefault(); // Impedisce il salto secco del browser
            const targetSection = document.getElementById('storia');
            
            // Fa scorrere la pagina in modo fluido fino alla sezione storia
            targetSection.scrollIntoView({ 
                behavior: 'smooth', 
                block: 'start' 
            });
        });
    </script>
</body>
</html>
