<!DOCTYPE html>

<head>

<title>Lega Fantacalcio Barriera dell'M</title>
<style>
:root{--blue-dark:#063b91;--blue:#084aa8;--blue-light:#0b58bd;--yellow:#ffe500;--yellow-soft:#fff06a;--white:#ffffff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--white);background:radial-gradient(circle at 50% 43%,rgba(22,101,210,.95) 0%,rgba(9,75,170,.92) 34%,rgba(4,48,119,1) 100%);overflow-x:hidden}
.topbar{position:sticky;top:0;z-index:1000;background:linear-gradient(180deg,#04377f 0%,#063f91 100%);border-bottom:2px solid var(--yellow);box-shadow:0 5px 18px rgba(0,0,0,.22)}
.nav{width:min(1500px,100%);margin:0 auto;display:flex;align-items:stretch;justify-content:flex-end;min-height:74px;padding:0 30px}
.nav a{display:flex;align-items:center;justify-content:center;padding:0 20px;color:var(--yellow);text-decoration:none;text-transform:uppercase;font-size:14px;font-weight:800;letter-spacing:.4px;white-space:nowrap;transition:background .2s ease,color .2s ease}
.nav a:hover,.nav a:focus-visible{background:rgba(255,229,0,.12);color:var(--white);outline:none}
main{width:min(1500px,100%);min-height:calc(100vh - 76px);margin:0 auto;padding:42px 24px 55px;display:flex;justify-content:flex-start;align-items:center;flex-direction:column}
.intro{width:100%;text-align:center}
.league-title{margin:0;color:var(--yellow);font-size:clamp(2.15rem,4.2vw,4.15rem);line-height:1.05;font-weight:900;letter-spacing:-.8px;white-space:nowrap;text-shadow:0 3px 0 rgba(0,0,0,.14),0 8px 25px rgba(0,0,0,.22)}
.subtitle{margin:12px 0 0;color:rgba(255,255,255,.88);font-size:clamp(.78rem,1.2vw,1rem);font-weight:700;text-transform:uppercase;letter-spacing:4px}
.title-line{width:min(970px,75%);height:2px;margin:17px auto 0;background:linear-gradient(90deg,transparent,var(--yellow),transparent)}
.foundation{margin-top:20px;text-align:center}
.foundation-label{display:block;color:var(--white);font-size:clamp(.88rem,1.35vw,1.2rem);font-weight:800}
.foundation-year{display:block;margin-top:3px;color:var(--yellow);font-size:clamp(2.3rem,4vw,3.7rem);line-height:1;font-weight:900;text-shadow:0 3px 12px rgba(0,0,0,.2)}
/* Il logo conserva la dimensione massima precedente (430px); il contenitore ha meno margine. */
.logo-area{width:min(460px,90vw);margin-top:20px;padding:12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#fff200 0%,#ffe000 100%);border:3px solid rgba(255,255,255,.92);border-radius:24px;box-shadow:0 0 0 2px rgba(255,229,0,.9),0 16px 45px rgba(0,0,0,.30);overflow:hidden;text-decoration:none;transition:transform .2s ease,box-shadow .2s ease}
.logo-area:hover,.logo-area:focus-visible{transform:translateY(-3px);box-shadow:0 0 0 2px rgba(255,229,0,.9),0 20px 50px rgba(0,0,0,.36);outline:none}
.logo-area img{width:100%;height:auto;max-width:430px;max-height:430px;object-fit:contain;display:block}
.logo-fallback{display:none;width:100%;aspect-ratio:1/1;align-items:center;justify-content:center;flex-direction:column;color:var(--blue-dark);text-align:center;border:5px solid var(--blue-dark);border-radius:50%;font-weight:900}
.logo-fallback .ball{font-size:6rem;line-height:1}.logo-fallback strong{font-size:1.55rem;margin-top:8px}.logo-fallback span{font-size:.9rem;margin-top:5px}
@media(max-width:900px){main{padding-top:36px}.league-title{white-space:normal;font-size:clamp(2rem,7vw,3.3rem)}}
@media(max-width:560px){.nav{min-height:62px;padding:0 16px}.nav a{font-size:12px;padding:0 10px}main{padding:28px 16px 42px}.subtitle{letter-spacing:2px}.title-line{width:88%}.logo-area{margin-top:18px;border-radius:18px;width:min(460px,90vw);padding:10px}}
/* Navigazione principale: pulsanti ai lati */
.topbar .nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
}
</style>
</head>

</section>

</html>
