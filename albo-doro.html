 {id:'serie-maxima',label:'Serie Maxima',category:'CAMPIONATO PRINCIPALE',logo:'serie-maxima.png',first:'1995/1996',data:alboSerieMaxima},
 {id:'apertura',label:'Torneo di Apertura',category:'TORNEO DI APERTURA',logo:'apertura.png',first:'1996/1997',data:alboApertura},
 {id:'chiusura',label:'Torneo di Chiusura',category:'TORNEO DI CHIUSURA',logo:'chiusura.png',first:'1996/1997',data:alboChiusura},
 {id:'extra-league',label:'Extra League',category:'COMPETIZIONE STORICA',logo:'extra-league.png',first:'1999/2000',data:alboExtraLeague},
 {id:'lefabam-cup',label:'Lefabam Cup',category:'COPPA',logo:'lefabam-cup.png',first:'2000/2001',data:alboLefabamCup},
 {id:'supercoppa',label:'Supercoppa di Lega',category:'SUPERCOPPA',logo:'supercoppa.png',first:'1999/2000',data:alboSupercoppa},
 {id:'mestolo',label:'Mestolo di Latta',category:'IL TROFEO CHE NESSUNO VUOLE',logo:'logo-mestolo.png',first:'1995/1996',data:alboMestolo,loser:true},
 {id:'serie-minus',label:'Serie Minus'},
 {id:'unicum',label:'Unicum Cup'},
 {id:'omnis',label:'OMNIS Cup',category:'COPPA',logo:'omnis-cup.png',first:'2021/2022',data:alboOmnisCup},
 {id:'altre',label:'Altre competizioni'}
];
const tabs=document.getElementById('competition-tabs');
const content=document.getElementById('competition-content');
function element(tag,cls,txt){const el=document.createElement(tag);if(cls)el.className=cls;if(txt!==undefined)el.textContent=txt;return el}
function makeCompetition(comp){
 const panel=element('section','panel');panel.id='competition-'+comp.id;panel.setAttribute('role','tabpanel');
 if(!comp.data){const empty=element('div','empty');empty.append(element('h2','',comp.label),element('p','',comp.id==='altre'?'Qui verranno raccolte le altre competizioni disputate nella storia della Lega.':"L'albo storico sarà inserito qui."));panel.append(empty);return panel}
 const heading=element('div','competition-heading'),icon=element('div','competition-icon'),img=document.createElement('img');img.src=comp.logo;img.alt='Logo '+comp.label;img.onerror=()=>{icon.classList.add('logo-missing')};icon.append(img);
 const headingText=element('div');headingText.append(element('div','competition-label',comp.category),element('h2','',comp.label),element('p','',"L'albo storico della competizione."));heading.append(icon,headingText);panel.append(heading);
 const played=comp.data.filter(x=>x.campione&&x.campione!=='—');const latest=played[played.length-1];
 if(latest){const champ=element('div','champion'),info=element('div','info');info.append(element('span','',comp.loser?'ULTIMO POSTO':'ULTIMO CAMPIONE'),element('strong','',latest.campione),element('small','',latest.stagione));champ.append(element('div','trophy',comp.loser?'🥄':'🏆'),info,element('div','season',latest.stagione));panel.append(champ)}
 const wins=new Map();for(const item of played)wins.set(item.campione,(wins.get(item.campione)||0)+1);
 const max=Math.max(0,...wins.values());const leaders=[...wins].filter(([,n])=>n===max).map(([name])=>name);
 const stats=element('div','stats');
 const items=[[String(played.length),'Edizioni disputate'],[max?leaders.join(' / ')+' — '+max+' '+(max===1?'vittoria':'vittorie'):'—',comp.loser?'Record':'Record di vittorie'],[String(wins.size),comp.loser?'Squadre assegnatarie':'Squadre vincitrici'],[comp.first,'Prima edizione']];
 for(const [value,label] of items){const stat=element('div','stat');stat.append(element('strong','',value),element('span','',label));stats.append(stat)}panel.append(stats);
 const wrapper=element('div','table-wrapper'),table=document.createElement('table'),thead=document.createElement('thead'),tr=document.createElement('tr');for(const title of ['#','Stagione',comp.loser?'Ultimo classificato':'Campione'])tr.append(element('th','',title));thead.append(tr);table.append(thead);
 const tbody=document.createElement('tbody');comp.data.forEach((item,i)=>{const row=document.createElement('tr');row.append(element('td','',String(i+1)),element('td','',item.stagione),element('td','',item.campione==='—'?'Non disputato':item.campione));tbody.append(row)});table.append(tbody);wrapper.append(table);panel.append(wrapper);return panel;
}
function activate(id){document.querySelectorAll('.tab').forEach(b=>{const active=b.dataset.id===id;b.classList.toggle('active',active);b.setAttribute('aria-selected',String(active))});document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='competition-'+id))}
for(const comp of competitions){const btn=element('button','tab',comp.label);btn.type='button';btn.dataset.id=comp.id;btn.setAttribute('role','tab');btn.addEventListener('click',()=>activate(comp.id));tabs.append(btn);content.append(makeCompetition(comp))}
activate('serie-maxima');
</script>
</body>
</html>
